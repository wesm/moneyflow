        - revision
        - pending
        - canonical_query
        - selection
        - selection_count
        - view
        - breadcrumbs
        - breadcrumb_text
        - filters
        - capabilities
        - total_rows
        - window
        - statistics
        - chart
      type: object
    ProviderConfirmationBody:
      additionalProperties: false
      properties:
        confirmation_token:
          maxLength: 4096
          minLength: 1
          type: string
        manual:
          type: boolean
        query:
          maxLength: 65536
          type: string
        selection:
          maxLength: 1468006
          type: string
        version:
          type: string
        window:
          $ref: "#/components/schemas/Window"
      required:
        - confirmation_token
        - version
        - manual
        - query
        - window
      type: object
    ProviderProgress:
      additionalProperties: false
      properties:
        fetched:
          format: int64
