components:
  schemas:
    ActiveDateRange:
      additionalProperties: false
      properties:
        from:
          type: string
        to:
          type: string
      required:
        - from
        - to
      type: object
    ActiveFilters:
      additionalProperties: false
      properties:
        date_range:
          $ref: "#/components/schemas/ActiveDateRange"
        show_hidden:
          type: boolean
        show_transfers:
          type: boolean
      required:
        - show_hidden
        - show_transfers
      type: object
    AggregateRow:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        dimension:
          type: string
        flags:
          $ref: "#/components/schemas/Flags"
        identity:
          type: string
        index:
          format: int64
          type: integer
        label:
          type: string
        period:
          $ref: "#/components/schemas/Period"
        share_tenths:
          format: int64
          type: integer
        top_category:
          type: string
        top_category_percent:
          format: int64
          type: integer
        total:
          $ref: "#/components/schemas/Money"
      required:
        - index
        - identity
        - dimension
        - label
        - count
        - total
        - share_tenths
        - flags
      type: object
    Bootstrap:
      additionalProperties: false
      properties:
        base_path:
          type: string
        canonical_url:
          type: string
        mutation_token:
          type: string
        revision:
          pattern: ^[0-9]+$
          type: string
        token_expires_at:
          format: date-time
          type: string
        version:
          type: string
      required:
        - version
        - canonical_url
        - base_path
        - revision
        - mutation_token
        - token_expires_at
      type: object
    Breadcrumb:
      additionalProperties: false
      properties:
        dimension:
          type: string
        label:
          type: string
      required:
        - dimension
        - label
      type: object
    Capability:
      additionalProperties: false
      properties:
        available:
          type: boolean
        category:
          type: string
        description:
          type: string
        id:
          type: string
        key_display:
          type: string
      required:
        - id
        - description
        - category
        - available
      type: object
    Chart:
      additionalProperties: false
      properties:
        marks:
          items:
            $ref: "#/components/schemas/ChartMark"
          type:
            - array
            - "null"
        summary:
          items:
            $ref: "#/components/schemas/Statistics"
          type:
            - array
            - "null"
      type: object
    ChartMark:
      additionalProperties: false
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        identity:
          type: string
        index:
          format: int64
          type: integer
        label:
          type: string
        plot_ratio:
          format: int64
          maximum: 10000
          minimum: -10000
          type: integer
      required:
        - index
        - identity
        - label
        - amount
        - plot_ratio
      type: object
    CommitBody:
      additionalProperties: false
      properties:
        expected_revision:
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        query:
          maxLength: 65536
          type: string
        reviewed_revision:
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        selection:
          maxLength: 1468006
          type: string
        version:
          type: string
        window:
          $ref: "#/components/schemas/Window"
      required:
        - version
        - expected_revision
        - reviewed_revision
        - query
        - window
      type: object
    DetailRow:
      additionalProperties: false
      properties:
        account:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        category:
          type: string
        date:
          type: string
        flags:
          $ref: "#/components/schemas/Flags"
        group:
          type: string
        identity:
          type: string
        index:
          format: int64
          type: integer
        merchant:
          type: string
      required:
        - index
        - identity
        - date
        - account
        - merchant
        - category
        - group
        - amount
        - flags
      type: object
    EditorCatalogBody:
      additionalProperties: false
      properties:
        expected_revision:
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        version:
          type: string
      required:
        - version
        - expected_revision
      type: object
    EditorCatalogResponse:
      additionalProperties: false
      properties:
        categories:
          items:
            $ref: "#/components/schemas/EditorChoice"
          type:
            - array
            - "null"
        groups:
          items:
            $ref: "#/components/schemas/EditorChoice"
          type:
            - array
            - "null"
        merchants:
          items:
            $ref: "#/components/schemas/EditorChoice"
          type:
            - array
            - "null"
        revision:
          pattern: ^[0-9]+$
          type: string
        version:
          type: string
      required:
        - version
        - revision
        - merchants
        - categories
        - groups
      type: object
    EditorChoice:
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        parent_id:
          type: string
        protected:
          type: boolean
      required:
        - id
        - label
        - protected
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Flags:
      additionalProperties: false
      properties:
        hidden:
          type: boolean
        pending:
          type: boolean
        selected:
          type: boolean
      required:
        - selected
        - hidden
        - pending
      type: object
    Health:
      additionalProperties: false
      properties:
        api_schema_version:
          type: string
        base_path:
          type: string
        data_status:
          type: string
        pending:
          $ref: "#/components/schemas/PendingSummary"
        read_only:
          type: boolean
        revision:
          pattern: ^[0-9]+$
          type: string
        version:
          type: string
      required:
        - version
        - api_schema_version
        - read_only
        - base_path
        - data_status
        - revision
        - pending
      type: object
    Money:
      additionalProperties: false
      properties:
        currency:
          type: string
        decimal:
          type: string
        display:
          type: string
        minor:
          type: string
        scale:
          format: int32
          minimum: 0
          type: integer
      required:
        - minor
        - currency
        - scale
        - decimal
        - display
      type: object
    MutationBody:
      additionalProperties: false
      properties:
        action:
          type: string
        expected_revision:
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        input:
          $ref: "#/components/schemas/MutationInput"
        query:
          maxLength: 65536
          type: string
        selection:
          maxLength: 1468006
          type: string
        target:
          $ref: "#/components/schemas/TransitionTarget"
        version:
          type: string
        window:
          $ref: "#/components/schemas/Window"
      required:
        - version
        - expected_revision
        - query
        - action
        - input
        - window
      type: object
    MutationInput:
      additionalProperties: false
      properties:
        destination_id:
          maxLength: 512
          type: string
        entity_id:
          maxLength: 512
          type: string
        group_id:
          maxLength: 512
          type: string
        label:
          maxLength: 512
          type: string
        replacement_id:
          maxLength: 512
          type: string
        scope:
          maxLength: 32
          type: string
        taxonomy:
          maxLength: 32
          type: string
      type: object
    MutationResponse:
      additionalProperties: false
      properties:
        canonical_query:
          type: string
        pending:
          $ref: "#/components/schemas/PendingSummary"
        projection:
          $ref: "#/components/schemas/Projection"
        revision:
          pattern: ^[0-9]+$
          type: string
        selection:
          $ref: "#/components/schemas/SelectionDisposition"
        version:
          type: string
      required:
        - version
        - revision
        - canonical_query
        - projection
        - pending
        - selection
      type: object
    PendingSummary:
      additionalProperties: false
      properties:
        active_operations:
          format: int64
          type: integer
        affected_transactions:
          format: int64
          type: integer
        inactive_operations:
          format: int64
          type: integer
      required:
        - active_operations
        - inactive_operations
        - affected_transactions
      type: object
    Period:
      additionalProperties: false
      properties:
        day:
          format: int64
          type: integer
        granularity:
          type: string
        month:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - granularity
        - year
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          type: string
        current_revision:
          pattern: ^[0-9]+$
          type: string
        detail:
          type: string
        selection:
          $ref: "#/components/schemas/SelectionDisposition"
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          default: about:blank
          format: uri
          type: string
      required:
        - title
        - status
        - detail
        - code
      type: object
    Projection:
      additionalProperties: false
      properties:
        aggregate_rows:
          items:
            $ref: "#/components/schemas/AggregateRow"
          type:
            - array
            - "null"
        api_schema_version:
          type: string
        breadcrumb_text:
          type: string
        breadcrumbs:
          items:
            $ref: "#/components/schemas/Breadcrumb"
          type:
            - array
            - "null"
        canonical_query:
          type: string
        capabilities:
          items:
            $ref: "#/components/schemas/Capability"
          type:
            - array
            - "null"
        chart:
          $ref: "#/components/schemas/Chart"
        detail_rows:
          items:
            $ref: "#/components/schemas/DetailRow"
          type:
            - array
            - "null"
        filters:
          $ref: "#/components/schemas/ActiveFilters"
        pending:
          $ref: "#/components/schemas/PendingSummary"
        projection_schema_version:
          type: string
        revision:
          pattern: ^[0-9]+$
          type: string
        selection:
          type: string
        selection_count:
          format: int64
          type: integer
        statistics:
          items:
            $ref: "#/components/schemas/Statistics"
          type:
            - array
            - "null"
        status:
          type: string
        total_rows:
          format: int64
          type: integer
        view:
          $ref: "#/components/schemas/ViewMetadata"
        warnings:
          items:
            $ref: "#/components/schemas/Warning"
          type:
            - array
            - "null"
        window:
          $ref: "#/components/schemas/ReturnedWindow"
      required:
        - api_schema_version
        - projection_schema_version
        - revision
        - pending
        - canonical_query
        - selection
        - selection_count
        - view
        - breadcrumbs
        - breadcrumb_text
        - filters
        - capabilities
        - total_rows
        - window
        - statistics
        - chart
      type: object
    ReturnedWindow:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        limit:
          format: int64
          type: integer
        offset:
          format: int64
          type: integer
      required:
        - offset
        - limit
        - count
      type: object
    ReviewBody:
      additionalProperties: false
      properties:
        expected_revision:
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        version:
          type: string
      required:
        - version
        - expected_revision
      type: object
    ReviewOperation:
      additionalProperties: false
      properties:
        active:
          type: boolean
        affected_count:
          format: int64
          type: integer
        after:
          type: string
        before:
          type: string
        operation_id:
          type: string
        taxonomy_effect:
          type: string
        type:
          type: string
      required:
        - operation_id
        - type
        - active
        - affected_count
      type: object
    ReviewResponse:
      additionalProperties: false
      properties:
        active_operations:
          items:
            $ref: "#/components/schemas/ReviewOperation"
          type:
            - array
            - "null"
        inactive_operations:
          items:
            $ref: "#/components/schemas/ReviewOperation"
          type:
            - array
            - "null"
        operation_id:
          type: string
        pending:
          $ref: "#/components/schemas/PendingSummary"
        revision:
          pattern: ^[0-9]+$
          type: string
        targets:
          items:
            $ref: "#/components/schemas/ReviewTarget"
          type:
            - array
            - "null"
        version:
          type: string
        window:
          $ref: "#/components/schemas/ReturnedWindow"
      required:
        - version
        - revision
        - pending
        - active_operations
        - inactive_operations
        - window
      type: object
    ReviewTarget:
      additionalProperties: false
      properties:
        category:
          type: string
        date:
          type: string
        hidden:
          type: boolean
        merchant:
          type: string
      required:
        - date
        - merchant
        - category
        - hidden
      type: object
    ReviewTargetsBody:
      additionalProperties: false
      properties:
        expected_revision:
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        operation_id:
          maxLength: 512
          type: string
        version:
          type: string
        window:
          $ref: "#/components/schemas/Window"
      required:
        - version
        - expected_revision
        - operation_id
        - window
      type: object
    RevisionBody:
      additionalProperties: false
      properties:
        expected_revision:
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        query:
          maxLength: 65536
          type: string
        selection:
          maxLength: 1468006
          type: string
        version:
          type: string
        window:
          $ref: "#/components/schemas/Window"
      required:
        - version
        - expected_revision
        - query
        - window
      type: object
    SelectionDisposition:
      additionalProperties: false
      properties:
        kind:
          type: string
        value:
          type: string
      required:
        - kind
        - value
      type: object
    Statistics:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        currency:
          type: string
        in:
          $ref: "#/components/schemas/Money"
        net:
          $ref: "#/components/schemas/Money"
        out:
          $ref: "#/components/schemas/Money"
        scale:
          format: int32
          minimum: 0
          type: integer
      required:
        - currency
        - scale
        - count
        - in
        - out
        - net
      type: object
    TransitionBody:
      additionalProperties: false
      properties:
        action:
          type: string
        filters:
          $ref: "#/components/schemas/TransitionFilters"
        query:
          maxLength: 65536
          type: string
        search:
          maxLength: 2048
          type: string
        selection:
          maxLength: 1468006
          type: string
        target:
          $ref: "#/components/schemas/TransitionTarget"
        window:
          $ref: "#/components/schemas/Window"
      required:
        - query
        - action
        - window
      type: object
    TransitionDateRange:
      additionalProperties: false
      properties:
        end:
          format: date
          type: string
        start:
          format: date
          type: string
      required:
        - start
        - end
      type: object
    TransitionFilters:
      additionalProperties: false
      properties:
        date_range:
          $ref: "#/components/schemas/TransitionDateRange"
        show_hidden:
          type: boolean
        show_transfers:
          type: boolean
      required:
        - show_hidden
        - show_transfers
      type: object
    TransitionTarget:
      additionalProperties: false
      properties:
        identity:
          maxLength: 4096
          type: string
        kind:
          type: string
      required:
        - kind
        - identity
      type: object
    ViewBody:
      additionalProperties: false
      properties:
        query:
          maxLength: 65536
          type: string
        selection:
          maxLength: 1468006
          type: string
        window:
          $ref: "#/components/schemas/Window"
      required:
        - query
        - window
      type: object
    ViewMetadata:
      additionalProperties: false
      properties:
        grouping:
          type: string
        mode:
          type: string
        search:
          type: string
        sort_direction:
          type: string
        sort_field:
          type: string
        time_granularity:
          type: string
      required:
        - mode
        - grouping
        - time_granularity
        - sort_field
        - sort_direction
      type: object
    Warning:
      additionalProperties: false
      properties:
        code:
          type: string
        detail:
          type: string
      required:
        - code
        - detail
      type: object
    Window:
      additionalProperties: false
      properties:
        limit:
          default: 200
          format: int64
          maximum: 400
          minimum: 1
          type: integer
        offset:
          default: 0
          format: int64
          maximum: 1000000
          minimum: 0
          type: integer
      required:
        - offset
        - limit
      type: object
info:
  title: moneyflow
  version: "1"
openapi: 3.1.0
paths:
  /api/v1/bootstrap:
    get:
      operationId: bootstrap
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Issue browser-memory mutation configuration
  /api/v1/commit:
    post:
      operationId: commitProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Commit one reviewed active journal prefix
  /api/v1/editor-catalog:
    post:
      operationId: editorCatalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorCatalogBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorCatalogResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Load bounded active editor choices
  /api/v1/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Report persistent profile service health
  /api/v1/mutations:
    post:
      operationId: mutateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MutationBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Apply one persistent profile action
  /api/v1/redo:
    post:
      operationId: redoProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
