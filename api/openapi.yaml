          type: integer
        generation:
          pattern: ^[0-9]+$
          type: string
        next_eligible:
          format: date-time
          type: string
        overrides:
          format: int64
          type: integer
        owner_instance_id:
          maxLength: 128
          type: string
        owner_renderer:
          type: string
        phase:
          type: string
        reason:
          type: string
        remaining:
          format: int64
          type: integer
        revision:
          pattern: ^[0-9]+$
