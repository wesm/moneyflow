components:
  schemas:
    ActiveDateRange:
      additionalProperties: false
      properties:
        from:
          type: string
        to:
          type: string
      required:
        - from
        - to
      type: object
    ActiveFilters:
      additionalProperties: false
      properties:
        date_range:
          $ref: "#/components/schemas/ActiveDateRange"
        show_hidden:
          type: boolean
        show_transfers:
          type: boolean
      required:
        - show_hidden
        - show_transfers
      type: object
    AggregateRow:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        dimension:
          type: string
        flags:
          $ref: "#/components/schemas/Flags"
        identity:
          type: string
        index:
          format: int64
          type: integer
        label:
          type: string
        period:
          $ref: "#/components/schemas/Period"
        share_tenths:
          format: int64
          type: integer
        top_category:
          type: string
        top_category_percent:
          format: int64
          type: integer
        total:
          $ref: "#/components/schemas/Money"
      required:
        - index
        - identity
        - dimension
        - label
        - count
        - total
        - share_tenths
        - flags
      type: object
    Bootstrap:
      additionalProperties: false
      properties:
        base_path:
          type: string
        canonical_url:
          type: string
        mutation_token:
          type: string
        revision:
          pattern: ^[0-9]+$
          type: string
        token_expires_at:
          format: date-time
          type: string
        version:
          type: string
      required:
        - version
        - canonical_url
        - base_path
        - revision
        - mutation_token
        - token_expires_at
      type: object
    Breadcrumb:
      additionalProperties: false
      properties:
        dimension:
          type: string
        label:
          type: string
      required:
        - dimension
        - label
      type: object
    Capability:
      additionalProperties: false
      properties:
        available:
          type: boolean
        category:
          type: string
        description:
          type: string
        id:
          type: string
        key_display:
          type: string
        reason:
          type: string
      required:
        - id
        - description
        - category
        - available
      type: object
    Chart:
      additionalProperties: false
      properties:
        marks:
          items:
            $ref: "#/components/schemas/ChartMark"
          type:
            - array
            - "null"
        summary:
          items:
            $ref: "#/components/schemas/Statistics"
          type:
            - array
            - "null"
      type: object
    ChartMark:
      additionalProperties: false
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        identity:
          type: string
        index:
          format: int64
          type: integer
        label:
          type: string
        plot_ratio:
          format: int64
          maximum: 10000
          minimum: -10000
          type: integer
      required:
        - index
        - identity
        - label
        - amount
        - plot_ratio
      type: object
    CommitBody:
      additionalProperties: false
      properties:
        expected_revision:
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        query:
          maxLength: 65536
          type: string
        reviewed_revision:
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        selection:
          maxLength: 1468006
          type: string
        version:
          type: string
        window:
          $ref: "#/components/schemas/Window"
      required:
        - version
        - expected_revision
        - reviewed_revision
        - query
        - window
      type: object
    DetailRow:
      additionalProperties: false
      properties:
        account:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        category:
          type: string
        date:
          type: string
        flags:
          $ref: "#/components/schemas/Flags"
        group:
          type: string
        identity:
          type: string
        index:
          format: int64
          type: integer
        merchant:
          type: string
      required:
        - index
        - identity
        - date
        - account
        - merchant
        - category
        - group
        - amount
        - flags
      type: object
    EditorCatalogBody:
      additionalProperties: false
      properties:
        expected_revision:
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        version:
          type: string
      required:
        - version
        - expected_revision
      type: object
    EditorCatalogResponse:
      additionalProperties: false
      properties:
        categories:
          items:
            $ref: "#/components/schemas/EditorChoice"
          type:
            - array
            - "null"
        groups:
          items:
            $ref: "#/components/schemas/EditorChoice"
          type:
            - array
            - "null"
        merchants:
          items:
            $ref: "#/components/schemas/EditorChoice"
          type:
            - array
            - "null"
        revision:
          pattern: ^[0-9]+$
          type: string
        version:
          type: string
      required:
        - version
        - revision
        - merchants
        - categories
        - groups
      type: object
    EditorChoice:
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        parent_id:
          type: string
        protected:
          type: boolean
      required:
        - id
        - label
        - protected
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Flags:
      additionalProperties: false
      properties:
        hidden:
          type: boolean
        pending:
          type: boolean
        selected:
          type: boolean
      required:
        - selected
        - hidden
        - pending
      type: object
    Health:
      additionalProperties: false
      properties:
        api_schema_version:
          type: string
        base_path:
          type: string
        data_status:
          type: string
        pending:
          $ref: "#/components/schemas/PendingSummary"
        read_only:
          type: boolean
        revision:
          pattern: ^[0-9]+$
          type: string
        version:
          type: string
      required:
        - version
        - api_schema_version
        - read_only
        - base_path
        - data_status
        - revision
        - pending
      type: object
    Money:
      additionalProperties: false
      properties:
        currency:
          type: string
        decimal:
          type: string
        display:
          type: string
        minor:
          type: string
        scale:
          format: int32
          minimum: 0
          type: integer
      required:
        - minor
        - currency
        - scale
        - decimal
        - display
      type: object
    MutationBody:
      additionalProperties: false
      properties:
        action:
          type: string
        expected_revision:
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        input:
          $ref: "#/components/schemas/MutationInput"
        query:
          maxLength: 65536
          type: string
        selection:
          maxLength: 1468006
          type: string
        target:
          $ref: "#/components/schemas/TransitionTarget"
        version:
          type: string
        window:
          $ref: "#/components/schemas/Window"
      required:
        - version
        - expected_revision
        - query
        - action
        - input
        - window
      type: object
    MutationInput:
      additionalProperties: false
      properties:
        destination_id:
          maxLength: 512
          type: string
        entity_id:
          maxLength: 512
          type: string
        group_id:
          maxLength: 512
          type: string
        label:
          maxLength: 512
          type: string
        replacement_id:
          maxLength: 512
          type: string
        scope:
          maxLength: 32
          type: string
        taxonomy:
          maxLength: 32
          type: string
      type: object
    MutationResponse:
      additionalProperties: false
      properties:
        canonical_query:
          type: string
        pending:
          $ref: "#/components/schemas/PendingSummary"
        projection:
          $ref: "#/components/schemas/Projection"
        provider_write:
          $ref: "#/components/schemas/ProviderWriteStatusResponse"
        revision:
          pattern: ^[0-9]+$
          type: string
        selection:
          $ref: "#/components/schemas/SelectionDisposition"
        version:
          type: string
      required:
        - version
        - revision
        - canonical_query
        - projection
        - pending
        - selection
      type: object
    OnboardingCancelBody:
      additionalProperties: false
      properties:
        expected_state_version:
          format: int64
          minimum: 0
          type: integer
        protocol_version:
          format: int32
          minimum: 0
          type: integer
      required:
        - protocol_version
        - expected_state_version
      type: object
    OnboardingCredentialsInput:
      additionalProperties: false
      properties:
        account_password:
          maxLength: 4096
          type: string
        confirmation:
          maxLength: 4096
          type: string
        email:
          maxLength: 4096
          type: string
        password:
          maxLength: 4096
          type: string
        totp_secret:
          maxLength: 4096
          type: string
      required:
        - email
        - password
        - totp_secret
        - account_password
        - confirmation
      type: object
    OnboardingFailureResponse:
      additionalProperties: false
      properties:
        can_reenter:
          type: boolean
        can_retry:
          type: boolean
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
        - can_retry
        - can_reenter
      type: object
    OnboardingProgressResponse:
      additionalProperties: false
      properties:
        attempt:
          format: int64
          type: integer
        elapsed_ms:
          format: int64
          type: integer
        fetched:
          format: int64
          type: integer
        partition:
          type: string
        pass:
          format: int64
          type: integer
        phase:
          type: string
        total:
          format: int64
          type: integer
      required:
        - phase
        - partition
        - fetched
        - total
        - attempt
        - pass
        - elapsed_ms
      type: object
    OnboardingSettingsInput:
      additionalProperties: false
      properties:
        currency:
          maxLength: 3
          minLength: 3
          type: string
        scale:
          format: int32
          maximum: 9
          minimum: 0
          type: integer
      required:
        - currency
        - scale
      type: object
    OnboardingStartBody:
      additionalProperties: false
      properties:
        month_to_date:
          type: boolean
        protocol_version:
          format: int32
          minimum: 0
          type: integer
        settings:
          $ref: "#/components/schemas/OnboardingSettingsInput"
      required:
        - protocol_version
        - month_to_date
      type: object
    OnboardingStatusResponse:
      additionalProperties: false
      properties:
        attempt_id:
          type: string
        failure:
          $ref: "#/components/schemas/OnboardingFailureResponse"
        profile_id:
          type: string
        progress:
          $ref: "#/components/schemas/OnboardingProgressResponse"
        protocol_version:
          format: int32
          minimum: 0
          type: integer
        provider_kind:
          type: string
        settings:
          $ref: "#/components/schemas/OnboardingSettingsInput"
        state:
          type: string
        state_version:
          format: int64
          minimum: 0
          type: integer
      required:
        - protocol_version
        - attempt_id
        - profile_id
        - state_version
        - state
        - provider_kind
      type: object
    OnboardingSubmitBody:
      additionalProperties: false
      properties:
        action:
          type: string
        credentials:
          $ref: "#/components/schemas/OnboardingCredentialsInput"
        expected_state_version:
          format: int64
          minimum: 0
          type: integer
        protocol_version:
          format: int32
          minimum: 0
          type: integer
        settings:
          $ref: "#/components/schemas/OnboardingSettingsInput"
        unlock:
          $ref: "#/components/schemas/OnboardingUnlockInput"
      required:
        - protocol_version
        - expected_state_version
        - action
      type: object
    OnboardingUnlockInput:
      additionalProperties: false
      properties:
        account_password:
          maxLength: 4096
          type: string
      required:
        - account_password
      type: object
    PendingSummary:
      additionalProperties: false
      properties:
        active_operations:
          format: int64
          type: integer
        affected_transactions:
          format: int64
          type: integer
        inactive_operations:
          format: int64
          type: integer
      required:
        - active_operations
        - inactive_operations
        - affected_transactions
      type: object
    Period:
      additionalProperties: false
      properties:
        day:
          format: int64
          type: integer
        granularity:
          type: string
        month:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - granularity
        - year
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          type: string
        current_revision:
          pattern: ^[0-9]+$
          type: string
        detail:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderStatusResponse"
        provider_write:
          $ref: "#/components/schemas/ProviderWriteStatusResponse"
        provider_write_confirmation_token:
          maxLength: 4096
          type: string
        selection:
          $ref: "#/components/schemas/SelectionDisposition"
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          default: about:blank
          format: uri
          type: string
      required:
        - title
        - status
        - detail
        - code
      type: object
    ProfileActivateBody:
      additionalProperties: false
      properties:
        key:
          maxLength: 128
          minLength: 1
          type: string
        provider_kind:
          enum:
            - monarch
            - local
          type: string
        version:
          type: string
      required:
        - version
        - key
      type: object
    ProfileCancelBody:
      additionalProperties: false
      properties:
        version:
          type: string
      required:
        - version
      type: object
    ProfileCancelResponse:
      additionalProperties: false
      properties:
