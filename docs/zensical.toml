[project]
site_name = "Moneyflow"
site_url = "https://moneyflow.dev/docs/"
site_description = "Review and refine your transactions in a browser, a terminal, or an MCP client, with local data and exact money."
docs_dir = ".site-work/current/pages"
site_dir = ".site-work/current/site"
repo_url = "https://github.com/wesm/moneyflow"
repo_name = "wesm/moneyflow"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/site.css"]
nav = [
  { "Start" = [
    { "Overview" = "index.md" },
    { "Installation" = "getting-started/installation.md" },
    { "Quick start" = "getting-started/quickstart.md" },
    { "Moving to Go" = "getting-started/transition.md" },
  ] },
  { "Interfaces" = [
    { "Web" = "guide/web.md" },
    { "Terminal" = "getting-started/go.md" },
    { "MCP" = "guide/mcp.md" },
    { "Agents" = "guide/agents.md" },
  ] },
  { "Workflows" = [
    { "Navigation and search" = "guide/navigation.md" },
    { "Keyboard shortcuts" = "guide/keyboard-shortcuts.md" },
    { "Filters and time" = "guide/filters.md" },
    { "Editing, duplicates and recovery" = "guide/editing.md" },
    { "Categories and groups" = "categories.md" },
    { "Export" = "guide/export.md" },
  ] },
  { "Providers" = [
    { "Monarch" = "guide/monarch.md" },
    { "YNAB" = "guide/ynab.md" },
    { "Amazon" = "guide/amazon-mode.md" },
    { "Bank CSV" = "guide/bank-csv.md" },
    { "SimpleFIN (experimental)" = "guide/simplefin.md" },
    { "SimpleFIN commands" = "guide/simplefin-cli.md" },
  ] },
  { "Configuration" = [
    { "Paths and web access" = "config/advanced.md" },
    { "Profiles, storage and refresh" = "config/caching.md" },
    { "Themes" = "config/themes.md" },
  ] },
  { "Reference" = [
    { "Commands and configuration" = "reference/cli.md" },
    { "Troubleshooting" = "reference/troubleshooting.md" },
    { "Common questions" = "reference/faq.md" },
    { "Changelog" = "reference/changelog.md" },
  ] },
  { "Development" = [
    { "Build and test" = "development/developing.md" },
    { "UI testing" = "development/ui-testing.md" },
    { "Contributing" = "development/contributing.md" },
    { "Releases" = "development/releases.md" },
    { "Embedding Moneyflow" = "development/embedding.md" },
  ] },
  { "Architecture" = [
    { "Overview" = "architecture/index.md" },
    { "State and storage" = "architecture/state-and-storage.md" },
    { "Providers" = "architecture/providers.md" },
    { "Interfaces" = "architecture/interfaces.md" },
    { "Verification" = "architecture/verification.md" },
    { "Decisions" = "architecture/decisions.md" },
    { "Cutover" = "architecture/cutover.md" },
    { "Website and publishing" = "architecture/website.md" },
  ] },
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
features = ["navigation.sections", "navigation.top", "content.code.copy"]
font = false

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/moon", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/sun", name = "Switch to light mode" }

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
"pymdownx.superfences" = {}
"pymdownx.details" = {}
"pymdownx.tabbed" = { alternate_style = true }

[project.extra]
homepage = "/"
