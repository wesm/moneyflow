# roborev per-repository configuration.
# https://www.roborev.io/configuration/

review_guidelines = '''
## Security trust/threat model

moneyflow is a single-user personal-finance TUI that stores data in local
SQLite databases and YAML config under a per-user directory (default
~/.moneyflow, overridable with --config-dir). Judge security findings
against this model, and state which trust assumption a finding violates.

### Trusted (do not file findings that require these to be hostile)

- The OS kernel, filesystem, Python runtime, and installed dependencies.
- Administrators/root and Windows service accounts (LocalSystem,
  TrustedInstaller, BUILTIN\Administrators).
- The user's own account and processes running as the user.
- OS-managed ancestors of the default config location (e.g. /home,
  C:\Users) with their stock permissions.

### In scope (must defend)

- Other non-privileged local users on a multi-user machine must not be
  able to read or modify financial data. Databases, config, and
  credentials are created with owner-only permissions (0o600/0o700 on
  POSIX, protected owner-only DACLs on Windows) and re-validated or
  re-tightened when opened.
- Symlink, junction, and other reparse-point redirection of paths under
  the config directory must be rejected before permission mutations and
  before opening databases. Writes to sensitive files must be atomic and
  must not follow symlinks.
- Path components must not be replaceable by untrusted principals
  (POSIX: ownership and mode checks; Windows: owner and DACL checks).
- Financial-data correctness (no silent loss, duplication, or
  miscategorization of transactions) is in scope at any severity.

### Accepted residual risk (do not file findings for these)

- Python's sqlite3 cannot open a database from a file descriptor or do
  dirfd-relative opens, so path-based connects cannot be made perfectly
  race-free. The required mitigations are handle-anchored ownership
  verification, no-delete-sharing handle pinning across connect on
  Windows, and post-open device/inode verification. Sub-millisecond
  multi-step TOCTOU races that defeat all of these simultaneously are
  accepted residual risk; do not request further guarantees that the
  sqlite3 API cannot express.
- A user who explicitly points --config-dir at a location whose
  ancestors are writable by or owned by untrusted accounts. The existing
  ancestor validation refuses the detectable cases and that is the
  intended extent of the defense: an attacker with that level of control
  over the user's chosen paths can compromise the environment more
  directly than through this application.

### Other review expectations

- Never include real personal or financial data (account names,
  merchants, transaction details) in code, tests, or review comments.
- This project treats warnings as errors; pyright runs on both POSIX and
  Windows, so platform-specific os attributes must be guarded.
'''
