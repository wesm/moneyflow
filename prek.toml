default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-case-conflict" },
  { id = "check-merge-conflict", args = ["--assume-in-merge"] },
  { id = "detect-private-key" },
  { id = "no-commit-to-branch" },
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "gofmt",
    name = "gofmt",
    language = "system",
    entry = "gofmt -w",
    files = "\\.go$",
    priority = 0,
  },
  {
    id = "ruff-format",
    name = "ruff format",
    language = "system",
    entry = "uv run ruff format",
    files = "\\.py$",
    exclude = "monarch_client\\.py$",
    priority = 0,
  },
  {
    id = "ruff-check",
    name = "ruff check --fix",
    language = "system",
    entry = "uv run ruff check --fix",
    files = "\\.py$",
    exclude = "monarch_client\\.py$",
    priority = 10,
  },
  {
    id = "pyright",
    name = "pyright",
    language = "system",
    entry = "uv run pyright moneyflow/",
    files = "\\.py$",
    pass_filenames = false,
    priority = 20,
  },
  {
    id = "pytest",
    name = "pytest (quick)",
    language = "system",
    entry = "uv run pytest -x -q",
    files = "\\.py$",
    pass_filenames = false,
    priority = 30,
  },
  {
    id = "go-test-quick",
    name = "go test (quick)",
    language = "system",
    entry = "make test-go-quick",
    files = "^(go\\.mod|go\\.sum|.*\\.go)$",
    pass_filenames = false,
    priority = 20,
  },
  {
    id = "go-vet",
    name = "go vet",
    language = "system",
    entry = "make vet",
    stages = ["pre-push"],
    types_or = ["go", "go-mod", "go-sum"],
    pass_filenames = false,
    priority = 20,
  },
  {
    id = "golangci-lint",
    name = "golangci-lint",
    language = "system",
    entry = "make lint",
    stages = ["pre-push"],
    types_or = ["go", "go-mod", "go-sum"],
    pass_filenames = false,
    # Both Go hooks generate ignored web assets. Run lint after vet so their
    # destructive embed steps never race on the same output directories.
    priority = 30,
  },
]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-hooks-apply" },
  { id = "check-useless-excludes" },
]
