name: Go

on:
  push:
    branches: [go-port, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  go:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages on Windows
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Generate embedded web distribution and build binary
        run: |
          make web-install
          make web-embed-check build

      - name: Use a private temp directory on the Windows runner disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Go on Windows reads TMP and TEMP, not TMPDIR, so tests used the slow C: disk.
          # Profile roots must be private, and runner.temp grants other principals access.
          $dir = Join-Path $env:RUNNER_TEMP 'private-tmp'
          New-Item -ItemType Directory -Force $dir | Out-Null
          icacls $dir /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' "${env:USERNAME}:(OI)(CI)F"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          for ($path = $dir; $path; $path = Split-Path -Parent $path) { icacls $path }
          foreach ($root in @($dir, $env:LOCALAPPDATA + '\Temp')) {
            for ($path = $root; $path; $path = Split-Path -Parent $path) { "OWNER $path => $((Get-Acl $path).Owner)" }
          }
          whoami /user /groups | Select-String 'User Name|S-1-5-21|Administrators|Mandatory'
          exit 1 # TEMPORARY: owner diagnostics only
          "TMP=$dir" >> $env:GITHUB_ENV
          "TEMP=$dir" >> $env:GITHUB_ENV

      - name: Test
        id: tests
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MONEYFLOW_UI_ARTIFACTS: ${{ runner.temp }}/ui-harness
        run: |
          MONEYFLOW_SKIP_PERF=1 go test -shuffle=on ./...
          go test ./internal/analytics -run '^TestQuery100KCompletesWithinInteractiveBudget$' -count=1 -v
          go test ./internal/api -run '^TestProjectionPerformance100K$' -count=1 -v
          go test ./internal/store/sqlite -run 'Test(FailureAtomicity|StoreFull|StoreBusy|StoreError|ColdProfilePerformance|BulkEditingPerformance|OpenInstallsOnlyCurrentSchema|OpenRejectsIncompatibleSchema)' -count=1 -v
          go test ./internal/app -run '^TestBulkEditingPerformance' -count=1 -v

      - name: Repeat concurrent token creation on macOS
        if: ${{ !cancelled() && matrix.os == 'macos-latest' && steps.tests.outcome != 'skipped' }}
        env:
          TMPDIR: ${{ runner.temp }}
          MONEYFLOW_UI_ARTIFACTS: ${{ runner.temp }}/ui-harness
        run: go test ./internal/home -run '^TestMCPHTTPTokenConcurrentEnsureReturnsOneValue$' -count=100

      - name: Profile startup after a test failure
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MONEYFLOW_UI_ARTIFACTS: ${{ runner.temp }}/ui-harness
        run: |
          mkdir -p "$RUNNER_TEMP/cold-start"
          go test -trimpath ./internal/store/sqlite -run '^$' \
            -bench '^BenchmarkColdProfile100K$' -benchtime=10x -count=1 \
            -o "$RUNNER_TEMP/cold-start/sqlite.test" \
            -cpuprofile="$RUNNER_TEMP/cold-start/cpu.pprof" \
            -memprofile="$RUNNER_TEMP/cold-start/heap.pprof"
          go tool pprof -top -cum -nodecount=40 "$RUNNER_TEMP/cold-start/cpu.pprof"
          go tool pprof -top -alloc_space -nodecount=20 "$RUNNER_TEMP/cold-start/heap.pprof"

      - name: Upload startup profiles
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-start-${{ matrix.os }}
          path: ${{ runner.temp }}/cold-start/*.pprof
          retention-days: 7
          if-no-files-found: warn

      - name: Test provider refresh slice
        env:
          TMPDIR: ${{ runner.temp }}
          MONEYFLOW_UI_ARTIFACTS: ${{ runner.temp }}/ui-harness
        run: make test-provider

      - name: Vet
        run: go vet ./...

      - name: Upload synthetic UI failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-harness-${{ matrix.os }}
          path: ${{ runner.temp }}/ui-harness/
          retention-days: 7
          if-no-files-found: ignore

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Generate embedded web distribution
        run: |
          make web-install
          make web-embed-check

      - name: Test with race detector
        env:
          MONEYFLOW_SKIP_PERF: "1"
          TMPDIR: ${{ runner.temp }}
          MONEYFLOW_UI_ARTIFACTS: ${{ runner.temp }}/ui-harness
        run: go test -race -shuffle=on ./...

      - name: Upload synthetic UI race failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-harness-race
          path: ${{ runner.temp }}/ui-harness/
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Generate embedded web distribution
        run: |
          make web-install
          make web-embed-check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  embed-consumer:
    name: Embedding package consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and run a consumer module without web assets
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          test ! -e internal/web/dist/.moneyflow-production.json
          module="$(go list -m)"
          deps="$(go list -e -deps -f '{{.ImportPath}}' .)"
          forbidden="$(grep -E -e '^charm\.land/' -e '^github\.com/spf13/cobra(/|$)' \
            -e "^$module/cmd/" -e "^$module/internal/(tui|web)(/|\$)" <<<"$deps" || true)"
          if [ -n "$forbidden" ]; then
            echo "The root package must not depend on the terminal UI, the CLI" \
              "or the web application."
            echo "It depends on:"
            echo "$forbidden"
            exit 1
          fi
          consumer="$RUNNER_TEMP/embedconsumer"
          mkdir -p "$consumer"
          cp scripts/testdata/embedconsumer/main.go "$consumer/main.go"
          cd "$consumer"
          go mod init example.com/embedconsumer
          go mod edit -require="$module@v0.0.0" -replace="$module=$GITHUB_WORKSPACE"
          go mod tidy
          go vet ./...
          go build ./...
          go run .
