name: Go

on:
  push:
    branches: [go-port, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.3
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Generate embedded web distribution
        run: |
          make web-install
          make web-embed-check

      - name: Build web-enabled binary
        run: make build

      - name: Test
        id: tests
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          MONEYFLOW_SKIP_PERF=1 go test -shuffle=on ./...
          go test ./internal/analytics -run '^TestQuery100KCompletesWithinInteractiveBudget$' -count=1
          go test ./internal/api -run '^TestProjectionPerformance100K$' -count=1
          go test ./internal/store/sqlite -run 'Test(FailureAtomicity|StoreFull|StoreBusy|StoreError|ColdProfilePerformance|BulkEditingPerformance|OpenInstallsOnlyCurrentSchema|OpenRejectsIncompatibleSchema)' -count=1
          go test ./internal/app -run '^TestBulkEditingPerformance' -count=1

      - name: Profile startup after a test failure
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/cold-start"
          go test -trimpath ./internal/store/sqlite -run '^$' \
            -bench '^BenchmarkColdProfile100K$' -benchtime=10x -count=1 \
            -o "$RUNNER_TEMP/cold-start/sqlite.test" \
            -cpuprofile="$RUNNER_TEMP/cold-start/cpu.pprof" \
            -memprofile="$RUNNER_TEMP/cold-start/heap.pprof"
          go tool pprof -top -cum -nodecount=40 "$RUNNER_TEMP/cold-start/cpu.pprof"
          go tool pprof -top -alloc_space -nodecount=20 "$RUNNER_TEMP/cold-start/heap.pprof"

      - name: Upload startup profiles
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-start-${{ matrix.os }}
          path: ${{ runner.temp }}/cold-start/*.pprof
          retention-days: 7
          if-no-files-found: warn

      - name: Test provider refresh slice
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-provider

      - name: Vet
        run: go vet ./...

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.3
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Generate embedded web distribution
        run: |
          make web-install
          make web-embed-check

      - name: Test with race detector
        env:
          MONEYFLOW_SKIP_PERF: "1"
          TMPDIR: ${{ runner.temp }}
        run: go test -race -shuffle=on ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.3
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Generate embedded web distribution
        run: |
          make web-install
          make web-embed-check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
