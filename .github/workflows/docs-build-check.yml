name: Documentation Build Check

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - '.markdownlint.json'
      - '.github/scripts/check-arrow-lists.sh'
      - 'Makefile'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docs-build-check.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - '.markdownlint.json'
      - '.github/scripts/check-arrow-lists.sh'
      - 'Makefile'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docs-build-check.yml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install real-application capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          GOBIN="$RUNNER_TEMP/site-tools" go install github.com/charmbracelet/freeze@v0.2.2
          echo "$RUNNER_TEMP/site-tools" >> "$GITHUB_PATH"
          make web-install
          cd web && bunx playwright install --with-deps chromium
      - name: Test assembly and build both documentation tiers
        env:
          TMPDIR: ${{ runner.temp }}
        run: make docs-test docs-check docs-browser-test
      - name: Upload combined site for review, without publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: moneyflow-site
          path: site/
          include-hidden-files: true
          if-no-files-found: error
