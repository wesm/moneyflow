name: Documentation Build Check

on:
  push:
    branches: [go-port, main]
    paths:
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/docs-build-check.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/docs-build-check.yml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Test assembly and build both documentation tiers
        run: make docs-test docs-build docs-check
      - name: Check Markdown
        run: |
          npx --yes markdownlint-cli@0.47.0 --config .markdownlint.json README.md 'docs/**/*.md'
          .github/scripts/check-arrow-lists.sh
      - name: Upload combined site for review, without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moneyflow-site
          path: site/
          include-hidden-files: true
          if-no-files-found: error
