name: Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  web:
    name: Generated assets and browser workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install frozen frontend dependencies
        run: make web-install

      - name: Install pinned Playwright browsers
        run: bun run --cwd web playwright install --with-deps chromium firefox webkit

      - name: Check frontend and run browser workflows
        env:
          TMPDIR: ${{ runner.temp }}
        run: make web-check web-test web-audit web-embed-check test-editing-go web-e2e

      - name: Upload synthetic browser failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-ui-harness
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  views-host:
    name: Views package in a sample host
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build a sample host against an archive of this commit
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/views-host-check.sh
