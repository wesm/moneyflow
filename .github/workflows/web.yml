name: Web

on:
  push:
    branches: [go-port, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Generated assets and browser workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.3
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install frozen frontend dependencies
        run: make web-install

      - name: Generate ignored embedded distribution
        run: make web-embed-check

      - name: Check generated API client
        run: bun run --cwd web generate:check

      - name: Check, test, audit, and build frontend
        run: |
          make web-check
          make web-test
          make web-audit

      - name: Install pinned Playwright browsers
        run: bun run --cwd web playwright install --with-deps chromium firefox webkit

      - name: Run browser workflows
        run: |
          make test-editing-e2e
          make test-provider-e2e
          make web-e2e
