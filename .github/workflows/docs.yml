name: Deploy Documentation

# Manual publication only. Configure required reviewers on this environment
# and disable the old stable-branch workflow before the first Go-site deployment.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: documentation-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install real-application capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          GOBIN="$RUNNER_TEMP/site-tools" go install github.com/charmbracelet/freeze@v0.2.2
          echo "$RUNNER_TEMP/site-tools" >> "$GITHUB_PATH"
          make web-install
          cd web && bunx playwright install --with-deps chromium
      - name: Verify the complete publication artifact
        run: make docs-test docs-build docs-check docs-browser-test
      - name: Publish root, walkthrough, current docs and archive together
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: moneyflow.dev
